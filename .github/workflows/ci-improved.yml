name: CI Improved

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  fast-check:
    name: Fast pre-merge checks (PR)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        go-version: [1.24]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go (shared)
        uses: ./.github/actions/ci-setup
        with:
          go-version: ${{ matrix.go-version }}

      - name: Check gofmt
        run: |
          # Only check tracked Go files to avoid scanning local module cache
          out=$(git ls-files '*.go' | xargs -r gofmt -l)
          if [ -n "$out" ]; then
            echo "Files need formatting:"; echo "$out"; exit 1
          fi

      - name: Run go vet
        run: go vet ./...
      - name: Install golangci-lint (fast)
        run: |
          # Install a pinned golangci-lint binary for fast PR checks.
          curl -sSfL https://github.com/golangci/golangci-lint/releases/download/v1.59.0/golangci-lint-1.59.0-linux-amd64.tar.gz -o /tmp/golangci.tar.gz
          tar -xzf /tmp/golangci.tar.gz -C $HOME

      - name: Run golangci-lint (fast)
        run: |
          # Disable the slow, type-aware linters during fast PR checks to
          # keep feedback quick; full CI will run the complete suite.
          $HOME/golangci-lint-1.59.0-linux-amd64/golangci-lint run --timeout=5m --disable=typecheck,staticcheck || true

      - name: Run unit tests (fast, excluding generator)
        run: |
          # Exclude the generator package tests which are run in a focused job.
          pkgs=$(go list ./... | grep -v "/internal/generator") || true
          if [ -n "$pkgs" ]; then
            echo "$pkgs" | xargs -r go test -v -count=1
          fi

  generator-tests:
    name: Generator tests (focused)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        go-version: [1.24]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go (shared)
        uses: ./.github/actions/ci-setup
        with:
          go-version: ${{ matrix.go-version }}
          gomodcache: ${{ github.workspace }}/.gomodcache
          goproxy: https://proxy.golang.org,direct
          gosumdb: sum.golang.org

      - name: Cache generator gomodcache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.gomodcache
          key: ${{ runner.OS }}-generator-gomodcache-${{ hashFiles('**/go.sum') }}

      - name: Run generator tests
        env:
          GOMODCACHE: ${{ github.workspace }}/.gomodcache
          GOFLAGS: -modcacherw
        run: |
          # Run only the generator package tests to validate generator helpers.
          go test ./internal/generator -v -count=1

  full-ci:
    name: Full CI (merge & nightly)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        go-version: [1.24, 1.25]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go (shared)
        uses: ./.github/actions/ci-setup
        with:
          go-version: ${{ matrix.go-version }}
          gomodcache: ${{ github.workspace }}/.gomodcache
          goproxy: https://proxy.golang.org,direct
          gosumdb: sum.golang.org

      - name: Cache Go build/cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ${{ github.workspace }}/.gomodcache
          key: ${{ runner.OS }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.OS }}-go-

      # After a cache restore, tar may not preserve the execute bit on Go toolchain
      # binaries stored inside the module cache (golang.org/toolchain@v...).
      # Fix them here so that subsequent go commands can fork/exec the tools.
      - name: Fix Go toolchain permissions
        run: |
          # Use GOMODCACHE (safe to query without toolchain-switching).
          # When the actions/cache restore strips executable bits we need to
          # ensure the Go toolchain modules under the module cache are
          # readable and executable where appropriate so go can fork/exec
          # the compiler/linker/vet/cover tools. Try a targeted approach
          # first, then fall back to a recursive readable+executable fix.
          set -euo pipefail
          GOMODCACHE="$(go env GOMODCACHE)"
          echo "GOMODCACHE=${GOMODCACHE}"
          # Target specific toolchain module directories if present
          for t in "${GOMODCACHE}/golang.org/toolchain@"*; do
            if [ -d "$t" ]; then
              echo "Fixing toolchain perms in: $t"
              # Ensure directories are searchable/executable
              find "$t" -type d -exec chmod a+rx {} + || true
              # Ensure known executable paths are executable
              find "$t" -type f -path '*/bin/*' -exec chmod a+x {} + || true
              find "$t" -type f -path '*/pkg/tool/*' -exec chmod a+x {} + || true
            fi
          done
          # If no toolchain directories matched, apply a safe fallback so
          # the Go commands can still run. This makes all files under
          # golang.org readable and directories executable.
          if [ -d "${GOMODCACHE}/golang.org" ]; then
            echo "Applying fallback perms to ${GOMODCACHE}/golang.org"
            chmod -R a+rX "${GOMODCACHE}/golang.org" || true
          fi

      - name: Install dependencies
        env:
          GOFLAGS: -modcacherw
        run: go mod download

      - name: Check gofmt
        run: |
          # Only check tracked Go files to avoid scanning local module cache
          out=$(git ls-files '*.go' | xargs -r gofmt -l)
          if [ -n "$out" ]; then
            echo "Files need formatting:"; echo "$out"; exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Install golangci-lint v2.9.0 (manual)
        run: |
          curl -sSfL https://github.com/golangci/golangci-lint/releases/download/v2.9.0/golangci-lint-2.9.0-linux-amd64.tar.gz -o /tmp/golangci.tar.gz
          tar -xzf /tmp/golangci.tar.gz -C $HOME
          ls -la $HOME/golangci-lint-2.9.0-linux-amd64

      - name: Run golangci-lint (manual run)
        run: |
          # Use the pinned binary and avoid passing --out-format which may
          # not be supported by certain builds. We only pass a timeout.
          $HOME/golangci-lint-2.9.0-linux-amd64/golangci-lint run --timeout=10m

      # staticcheck is now executed via golangci-lint (enabled in .golangci.yml).

      - name: Run tests (race + coverage)
        env:
          GOFLAGS: -modcacherw
        run: |
          mkdir -p .ci
          # Re-apply permissions using GOMODCACHE (safe without toolchain-switching).
          # go mod download, go vet, and golangci-lint can re-extract toolchain
          # modules without execute bit; fixing here is the definitive guard.
          GOMODCACHE="$(go env GOMODCACHE)"
          if [ -d "${GOMODCACHE}/golang.org" ]; then
            find "${GOMODCACHE}/golang.org" -type f -exec chmod a+x {} + || true
          fi
          go test ./... -race -coverprofile=.ci/coverage.out -covermode=atomic

      - name: Upload coverage artifact
        continue-on-error: true   # act artifact-server protocol mismatch; works fine on GitHub Actions
        uses: actions/upload-artifact@v7
        with:
          # Make artifact name unique per matrix job and per workflow run to avoid 409 Conflict
          name: coverage-report-${{ matrix.go-version }}-${{ github.run_id }}
          path: .ci/coverage.out

      - name: Upload coverage to Codecov (guarded)
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "$CODECOV_TOKEN" ]; then
            echo "Uploading coverage to Codecov"
            # Use the official bash uploader when token is present. Keep
            # `|| true` so the CI doesn't fail if the uploader exits non-zero.
            curl -s https://codecov.io/bash | bash -s -- -t "$CODECOV_TOKEN" -f .ci/coverage.out || true
          else
            echo "CODECOV_TOKEN not set; skipping codecov upload"
          fi
